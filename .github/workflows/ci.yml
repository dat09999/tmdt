name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  # =========================================================================
  # 1. Backend CI: Build, Test & Package Spring Boot Application
  # =========================================================================
  backend-ci:
    name: Backend (Java 17 / Spring Boot)
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Grant Execute Permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Generate CI application.properties
        run: |
          cat << 'EOF' > src/main/resources/application.properties
          spring.application.name=backend
          jwt.secret=VGhpc0lzQVNlY3JldEtleUZvckpXVFRoaXNJc0FTZWNyZXRLZXlGb3JKV1Q=
          jwt.expiration=900000
          jwt.refresh-expiration=604800000
          spring.data.mongodb.uri=mongodb://localhost:27017/ecommerce
          spring.data.mongodb.auto-index-creation=true
          minio.url=http://localhost:9000
          minio.access-key=minioadmin
          minio.secret-key=minioadmin
          minio.bucket-name=product-images
          minio.bucket-video=product-video
          minio.bucket-user=user-images
          spring.servlet.multipart.max-file-size=150MB
          spring.servlet.multipart.max-request-size=300MB
          vnpay.tmn-code=DKUIV5V2
          vnpay.hash-secret=FSHEZV8321H4PZGD84EGAS6OK4CMUISF
          vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
          vnpay.return-url=https://tmdt-lovat.vercel.app/payment/vnpay-result
          server.port=8080
          app.frontend-url=http://localhost:5173
          gogoduk.api-key=dummy_test_key
          EOF

      - name: Compile Backend
        run: ./mvnw compile --batch-mode

      - name: Run Unit & Integration Tests
        run: ./mvnw test --batch-mode

      - name: Package Application (JAR)
        run: ./mvnw package -DskipTests --batch-mode

  # =========================================================================
  # 2. Frontend CI: Dependency Check & Production Build
  # =========================================================================
  frontend-ci:
    name: Frontend (React / Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci

      - name: Build Frontend Production Bundle
        run: npm run build
